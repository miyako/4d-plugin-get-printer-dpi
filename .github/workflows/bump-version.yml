name: Bump version

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Semantic version bump
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

concurrency:
  group: bump-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: validate, bump and commit source metadata only
        id: bump
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != branch ] || [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::Bump requires a selected branch checked out at the selected SHA."
            exit 1
          fi
          REMOTE=$(git ls-remote --heads origin "refs/heads/$GITHUB_REF_NAME")
          if [ "$REMOTE" != "$(printf '%s\trefs/heads/%s' "$GITHUB_SHA" "$GITHUB_REF_NAME")" ]; then
            echo "::error::Selected branch moved or disappeared; select its current commit and retry."
            exit 1
          fi
          NEW=$(python3 .github/scripts/version.py "$MODE")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add get-printer-dpi.xcodeproj/project.pbxproj Info.plist English.lproj/InfoPlist.strings
          git commit -m "chore: bump version to ${NEW}"
          git -c push.followTags=false push --no-follow-tags origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: summary
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: echo "### Source version bumped to $VERSION. No tag or build created. Run Build separately on the updated branch." >> "$GITHUB_STEP_SUMMARY"
